server { listen 80; server_name _; root /usr/share/nginx/html; index index.html; location /api/ { proxy_pass http://api:3000/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; } location /uploads/ { proxy_pass http://api:3000/uploads/; } location = /sitemap.xml { proxy_pass http://api:3000/sitemap.xml; } location = /robots.txt { proxy_pass http://api:3000/robots.txt; } location / { try_files $uri $uri/ /index.html; } add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy strict-origin-when-cross-origin always; }
